# Адреса, с которых разрешен вход, 1 - разрешен, 0 - запрещен
geo $corp_net {
    default     0;

    # Корпоративная сеть:
    87.226.249.28   1;
    87.226.249.29   1;
    87.226.249.30   1;
    87.226.249.31   1;
    188.128.45.34   1;
    188.128.45.35   1;
    188.128.45.36   1;
    188.128.45.37   1;

    # Временная сеть:
    89.250.174.93   1; #пк - Ngate
    77.90.63.246    1; #пк - vpn
    92.252.154.11   1; #пк
    172.18.0.1      1; #локальная проверка
}

log_format corp '$remote_addr corp=$corp_net - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 8080;
    server_name _;

    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout corp;

    # Вход - только для разрешенных сетей
    location = /api/auth/login {
        if ($corp_net = 0) {
            return 403;
        }
        proxy_pass http://backend:3000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Страница входа - только для разрешенных сетей
    location = /login {
        if ($corp_net = 0) {
            return 403;
        }
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Скрытые файлы не отдавать
    location ~ /\. {
        return 404;
    }
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}
